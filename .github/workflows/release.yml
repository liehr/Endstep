name: Release

# Publish a new version: Actions → Release → Run workflow.
#   patch = small fix               (0.1.0 → 0.1.1)
#   minor = new feature             (0.1.0 → 0.2.0)
#   major = big change              (0.1.0 → 1.0.0)
# The workflow checks the app, bumps the version, creates the tag and GitHub
# release and rolls out the new version. The installed app then shows
# "New version available".
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type of change
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Please start releases from master (selected: ${{ github.ref_name }})."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "Release v%s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Push commit and tag
        run: git push --atomic origin HEAD:master "${{ steps.version.outputs.tag }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
